repos:
- repo: https://github.com/psf/black
  rev: stable
  hooks:
  - id: black
- repo: https://github.com/pycqa/flake8
  rev: 7.1.1
  hooks:
  - id: flake8
    args: [--toml-config=./pyproject.toml,]
    exclude: (tests|docs)/.*
- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
  - id: isort
